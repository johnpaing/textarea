<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textarea Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
      <textarea placeholder="Start typing..."  maxlength="251"></textarea>
        <span class="title">Write your Message</span>
        <div class="characters">
            <span class="num">0</span>
            <span class="limit_num">/250</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
